name: CIS - Pipeline Input Output

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-validate:
    name: Generate and validate artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    env:
      INPUT_MESSAGE: CIS pipeline lab
      OUTPUT_FILE: output/message.txt

    steps:
      - name: Generate output from declared input
        shell: bash
        run: |
          mkdir -p "$(dirname "$OUTPUT_FILE")"
          printf '%s\n' "$INPUT_MESSAGE" > "$OUTPUT_FILE"
          echo "Input: INPUT_MESSAGE"
          echo "Output: $OUTPUT_FILE"

      - name: Validate generated output
        shell: bash
        run: |
          test -s "$OUTPUT_FILE"
          printf '%s\n' "$INPUT_MESSAGE" | cmp - "$OUTPUT_FILE"
          echo "PASS: output exists and matches the input"
          sha256sum "$OUTPUT_FILE"

      - name: Store validated artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-message-${{ github.run_id }}
          path: output/message.txt
          if-no-files-found: error
          retention-days: 7
