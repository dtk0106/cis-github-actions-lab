name: CIS - Runner Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Show runner information
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          echo "Environment: $RUNNER_ENVIRONMENT"
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          cat /etc/os-release
