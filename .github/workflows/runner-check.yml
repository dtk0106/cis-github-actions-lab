name: CIS - Runner Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Show runner information
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          echo "Environment: $RUNNER_ENVIRONMENT"
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          cat /etc/os-release
  verify-platform:
    needs: inspect-runner
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Verify required operating system
        run: |
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          echo "PASS: Ubuntu 24.04"
  check-network:
    needs: verify-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check outbound HTTPS access
        run: |
          for url in https://github.com https://example.com; do
            echo "Checking $url"
            if curl --head --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              "$url" > /dev/null; then
              echo "REACHABLE: $url"
            else
              echo "NOT REACHABLE: $url"
            fi
          done
